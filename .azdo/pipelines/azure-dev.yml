# Run when commits are pushed to mainline branch (main)
# Set this to the mainline branch you are using
trigger:
  - main

# Azure Pipelines workflow to deploy to Azure using azd
# To configure required secrets for connecting to Azure, simply run `azd pipeline config --provider azdo`

pool:
  vmImage: ubuntu-latest

steps:

  - task: setup-azd@1
    displayName: Install azd
# If you can't install above task in your organization, you can comment it and uncomment below task to install azd
# - task: Bash@3
#   displayName: Install azd
#   inputs:
#     targetType: 'inline'
#     script: |
#       curl -fsSL https://aka.ms/install-azd.sh | bash

  - pwsh: |
      azd config set auth.useAzCliAuth "true"
    displayName: Configure AZD to Use AZ CLI Authentication.

  - task: AzureCLI@2
    displayName: Set Azure Spring Apps alpha feature on
    inputs:
      azureSubscription: azconnection
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        azd config set alpha.springapp on

  - task: AzureCLI@2
    displayName: Provision Infrastructure
    inputs:
      azureSubscription: azconnection
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        azd provision --no-prompt
    env:
      AZURE_SUBSCRIPTION_ID: $(AZURE_SUBSCRIPTION_ID)
      AZURE_ENV_NAME: $(AZURE_ENV_NAME)
      AZURE_LOCATION: $(AZURE_LOCATION)
      azureOpenAiApiKey: $(AZURE_OPENAI_API_KEY)
      azureOpenAiEndpoint: $(AZURE_OPENAI_ENDPOINT)
      azureOpenAiDeploymentId: $(AZURE_OPENAI_DEPLOYMENT_ID)
      isAzureOpenAiGpt4Model: $(IS_AZURE_OPENAI_GPT4_MODEL)
      
  - task: AzureCLI@2
    displayName: Deploy Application
    inputs:
      azureSubscription: azconnection
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        azd deploy --no-prompt
    env:
      AZURE_SUBSCRIPTION_ID: $(AZURE_SUBSCRIPTION_ID)
      AZURE_ENV_NAME: $(AZURE_ENV_NAME)
